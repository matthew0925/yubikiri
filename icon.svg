<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F0"/>
      <stop offset="100%" stop-color="#EFE1CB"/>
    </linearGradient>

    <linearGradient id="fistL" x1="0.15" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#5E4B3B"/>
      <stop offset="100%" stop-color="#3A2E24"/>
    </linearGradient>
    <linearGradient id="fistR" x1="0.85" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#6D5847"/>
      <stop offset="100%" stop-color="#42342A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g style="filter:drop-shadow(0 12px 18px rgba(42,31,23,0.20))">
    <!-- 右手：握りこぶし -->
    <g transform="translate(650,760) rotate(6)">
      <rect x="-140" y="-96" width="280" height="192" rx="92" fill="url(#fistR)"/>
    </g>

    <!-- 右の小指：太く大きくフックして左側へ交差 -->
    <path d="M 610 660
             C 596 520, 540 420, 440 388
             C 388 371, 350 398, 352 440
             C 354 474, 388 494, 422 484"
          fill="none" stroke="url(#fistR)" stroke-width="76" stroke-linecap="round"/>

    <!-- 左手：握りこぶし -->
    <g transform="translate(374,760) rotate(-6)">
      <rect x="-140" y="-96" width="280" height="192" rx="92" fill="url(#fistL)"/>
    </g>

    <!-- 左の小指：太く大きくフックして右側へ交差 -->
    <path d="M 414 660
             C 428 520, 484 420, 584 388
             C 636 371, 674 398, 672 440
             C 670 474, 636 494, 602 484"
          fill="none" stroke="url(#fistL)" stroke-width="76" stroke-linecap="round"/>
  </g>

  <!-- 赤い糸の結び目：2本のフックが交差する点 -->
  <circle cx="512" cy="432" r="30" fill="none" stroke="#C8422D" stroke-width="14"/>
  <circle cx="512" cy="432" r="9" fill="#C8422D"/>
</svg>
